<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} - {{ title }} | EduMonitor AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center p-4" style="max-width: 520px;">
        <div class="display-1 fw-bold text-danger mb-3">{{ code }}</div>
        <h3 class="fw-bold text-dark">{{ title }}</h3>
        <p class="text-muted mb-4">{{ message }}</p>
        <div class="d-flex justify-content-center gap-2">
            <a href="javascript:history.back()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Go Back
            </a>
            <a href="{{ url_for('index') }}" class="btn btn-teal">
                <i class="bi bi-house-door-fill me-1"></i> Return Home
            </a>
        </div>
    </div>
</body>
</html>
