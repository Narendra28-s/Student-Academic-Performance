{% extends "base.html" %}

{% block title %}Change Password - EduMonitor AI{% endblock %}
{% block header_title %}Account Security{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="table-card p-4">
            <h5 class="fw-bold mb-3 text-secondary-navy"><i class="bi bi-shield-lock-fill me-2 text-teal"></i>Change Password</h5>
            <p class="text-muted small">Update your account password. Must be at least 6 characters long.</p>
            
            <form method="POST" action="{{ url_for('auth.change_password') }}">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Current Password</label>
                    <input type="password" name="current_password" class="form-control" required placeholder="Enter current password">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">New Password</label>
                    <input type="password" name="new_password" class="form-control" minlength="6" required placeholder="Enter new password">
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" minlength="6" required placeholder="Re-enter new password">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-teal fw-bold"><i class="bi bi-check-circle me-1"></i>Update Password</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
