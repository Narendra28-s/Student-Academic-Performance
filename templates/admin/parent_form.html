{% extends "base.html" %}

{% block title %}Add Parent - EduMonitor AI{% endblock %}
{% block header_title %}Register Parent Account{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="table-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                <h5 class="fw-bold text-secondary-navy mb-0">
                    <i class="bi bi-person-hearts me-2 text-teal"></i>Parent Account Registration
                </h5>
                <a href="{{ url_for('admin.parents_list') }}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Back to Parents
                </a>
            </div>

            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Parent Full Name *</label>
                        <input type="text" name="full_name" class="form-control" placeholder="e.g. Mr. Robert Davis" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Email Address *</label>
                        <input type="email" name="email" class="form-control" placeholder="parent@eft.edu" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Initial Password *</label>
                        <input type="text" name="password" class="form-control" value="Parent@123" required>
                        <small class="text-muted">Password can be updated on first login.</small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Contact Phone Number</label>
                        <input type="text" name="phone" class="form-control" placeholder="+1 555-0103">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Occupation / Profession</label>
                        <input type="text" name="occupation" class="form-control" placeholder="e.g. Architect, Engineer, Doctor">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Residential Address</label>
                        <input type="text" name="address" class="form-control" placeholder="City, State">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="{{ url_for('admin.parents_list') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-teal fw-bold">
                        <i class="bi bi-check-circle me-1"></i> Create Parent Account
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
