<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Academic Performance Monitoring System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h2>EduMonitor AI</h2>
            <p>Student Academic Performance Monitoring & Prediction System</p>
        </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show small py-2" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="mb-3">
                <label for="email" class="form-label small fw-bold text-secondary">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="name@eft.edu" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label small fw-bold text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="role" class="form-label small fw-bold text-secondary">Select Role</label>
                <select class="form-select" id="role" name="role">
                    <option value="" {% if not selected_role %}selected{% endif %}>Auto-Detect Account Role</option>
                    <option value="admin" {% if selected_role == 'admin' %}selected{% endif %}>Admin (Full System Management)</option>
                    <option value="faculty" {% if selected_role == 'faculty' %}selected{% endif %}>Faculty (Academic Management)</option>
                    <option value="parent" {% if selected_role == 'parent' %}selected{% endif %}>Parent (Child Performance Tracking)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-teal w-100 py-2 fw-bold mt-2 shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
            </button>
        </form>

        <!-- Demo Accounts Box (Quick fill buttons) -->
        <div class="demo-account-box">
            <h6><i class="bi bi-key-fill text-warning me-1"></i> Quick Demo Accounts (Local Testing):</h6>
            
            <button type="button" class="demo-btn" onclick="fillDemo('admin@eft.edu', 'Admin@123', 'admin')">
                <div>
                    <strong>Admin:</strong> admin@eft.edu
                    <div class="text-muted small">Pass: Admin@123</div>
                </div>
                <span class="badge bg-danger-subtle text-danger border border-danger-subtle">Admin</span>
            </button>

            <button type="button" class="demo-btn" onclick="fillDemo('faculty@eft.edu', 'Faculty@123', 'faculty')">
                <div>
                    <strong>Faculty:</strong> faculty@eft.edu
                    <div class="text-muted small">Pass: Faculty@123 (Dr. Rajesh Sharma)</div>
                </div>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle">Faculty</span>
            </button>

            <button type="button" class="demo-btn" onclick="fillDemo('parent@eft.edu', 'Parent@123', 'parent')">
                <div>
                    <strong>Parent:</strong> parent@eft.edu
                    <div class="text-muted small">Pass: Parent@123 (Child: John Davis)</div>
                </div>
                <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">Parent</span>
            </button>

            <button type="button" class="demo-btn" onclick="fillDemo('parent2@eft.edu', 'Parent@123', 'parent')">
                <div>
                    <strong>Parent 2 (Multi-child):</strong> parent2@eft.edu
                    <div class="text-muted small">Pass: Parent@123 (Children: Priya & Rahul)</div>
                </div>
                <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">Parent</span>
            </button>
        </div>
    </div>

    <!-- Script for demo buttons -->
    <script>
        function fillDemo(email, pass, role) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
            document.getElementById('role').value = role;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
